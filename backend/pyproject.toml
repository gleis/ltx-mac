[project]
name = "ltx-desktop-backend"
version = "1.0.0"
description = "LTX-2 Video Generation Backend"
requires-python = ">=3.12"
dependencies = [
    "pillow>=13.0.0",
    "av>=16.1.0,<17",
    "torch>=2.13.0",
    # transformers' Gemma 4 processor imports torchvision.transforms.v2 at module scope, so
    # LTX 2.5's text encoder fails to build without it (ImportError on Gemma4UnifiedProcessor).
    "torchvision>=0.18.0",
    "huggingface-hub>=0.23.0",
    "tqdm>=4.66.0",
    # Windows ships no IANA timezone database. ZoneInfo needs this for dashboard ranges.
    "tzdata>=2024.1",
    "pynvml>=11.5.0; sys_platform != 'darwin'",
    "psutil>=5.9.0",
    "pydantic>=2.7.0",
    "filelock>=4.2.1",
    "setuptools>=84.1.0",
    "pydantic-ai-slim[google,openai]>=1.0,<3",
    "httpx2>=2.13,<3",
    "httpx>=0.27",
    # LTX-2 inference dependencies (v1.4.1).
    # LLM: changing ltx-core / ltx-pipelines version or git tag requires re-checking
    # every monkey-patch in backend/services/patches/ (imported from ltx2_server.py).
    # Those rebind private upstream symbols; drop a patch only if upstream now includes
    # the fix (see each module's "Remove once ..." docstring) and its tests still pass.
    "ltx-core==1.4.1",
    "ltx-pipelines==1.4.1",
    "diffusers>=0.39.0",
    # ltx-core 1.4 imports colour-science. Without matplotlib, colour.plotting puts MagicMock
    # objects in sys.modules["matplotlib"], and diffusers' importlib.util.find_spec("matplotlib")
    # then raises "matplotlib.__spec__ is not set", so the backend dies at startup.
    "matplotlib>=3.8",
    "ftfy>=6.0.0",
    "imageio>=2.37.2",
    "imageio-ffmpeg>=0.6.0",
    "peft>=0.13.2",
    "protobuf>=3.20.0",
    # ltx-core 1.2 / Gemma 4 need transformers 5.8+; 5.15 makes Gemma 4
    # attention dims per-layer (AmbiguousGlobalPerLayerAttributeError).
    "transformers>=5.14.1,<5.15",
    "sentencepiece>=0.1.99",
    "sageattention>=1.0.0; sys_platform == 'linux'",
    # Optional CUDA accelerators must be rebuilt for the patched Torch ABI.
    # ninja is required (on PATH) for torch to JIT-build mps-sdpa's zero-copy
    # `mpsgraph_zc` attention backend on Apple Silicon. Without it, mps-sdpa
    # silently falls back to the pyobjc `mpsgraph` backend, which leaks Metal
    # memory per attention call and OOMs longer generations. macOS-only.
    "ninja>=1.11; sys_platform == 'darwin'",
    "opencv-python-headless>=4.8.0",
    "fastapi>=0.141.1",
    # FastAPI 0.129 pinned starlette<1; 0.141+ allows the 1.x line.
    "starlette>=1.6.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.32",
    "triton-windows; sys_platform == 'win32'",
    "triton; sys_platform == 'linux'",
]

[tool.uv.sources]
ltx-core = { git = "https://github.com/Lightricks/LTX-2.git", subdirectory = "packages/ltx-core", rev = "2d6e71c88be37b55a2dd698c2dff447edfbe5898" }
ltx-pipelines = { git = "https://github.com/Lightricks/LTX-2.git", subdirectory = "packages/ltx-pipelines", rev = "2d6e71c88be37b55a2dd698c2dff447edfbe5898" }

[[tool.uv.dependency-metadata]]
name = "ltx-core"
version = "1.4.1"
requires-dist = [
    "torch~=2.7",
    "torchaudio",
    "torchvision",
    "einops",
    "numpy",
    "colour-science",
    "av",
    "transformers>=5.8.0,<5.15",
    "safetensors",
    "accelerate",
    "scipy>=1.14",
    "mps-sdpa>=0.2.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[[tool.uv.dependency-metadata]]
name = "ltx-pipelines"
version = "1.4.1"
requires-dist = ["ltx-core", "av", "tqdm", "pillow", "openimageio", "cloudpickle>=3.1"]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "requests>=2.34.2",
    "httpx>=0.27",
    "pytest-split>=0.11.0",
]
dev = ["pyright>=1.1.380", "debugpy>=1.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "ci_os: needs the real Windows runner. Linux CI runs the full suite; Windows runs only this marker.",
]
