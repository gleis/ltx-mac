allowBuilds:
  electron: true
  esbuild: true
  electron-winstaller: true
  iconv-corefoundation: true
  koffi: true
  "@parcel/watcher": true
  core-js: false

minimumReleaseAgeExclude:
  - "vite-plugin-electron@0.29.1"
  - "electron@41.0.2"

  # Exact security update; audited before use (2026-11-06).
  - "electron@45.2.3"
  - "zod@4.6.7"
  - "tar@7.5.21"
  - "@xmldom/xmldom@0.8.15"
  - "tmp@0.2.7"
  - "form-data@4.0.6"

overrides:
  minimatch: "^11.0.2"
  rollup: "^4.59.0"
  tar: "7.5.21"

  "@xmldom/xmldom": "0.8.15"
  tmp: "0.2.7"
  form-data: "4.0.6"

  picomatch: ">=4.0.4"
  deepmerge-ts: ">=8.0.0"
  source-map-js: ">=1.2.2"
  zod: "4.6.7"
